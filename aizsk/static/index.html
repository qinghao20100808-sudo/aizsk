<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 实时受力分析系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column;
}
header {
  background: linear-gradient(135deg,#1a1a2e,#16213e); padding: 14px 24px;
  border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; gap: 16px;
}
header h1 { font-size: 20px; font-weight: 600; background: linear-gradient(90deg,#00d4ff,#7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; display: inline-block; }
.dot.on { background: #44ff44; }

.main { display: flex; flex: 1; padding: 16px; gap: 16px; }
.video-section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.video-wrapper {
  position: relative; background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a4a;
  overflow: hidden; flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 540px; cursor: crosshair;
}
.video-wrapper canvas {
  width: 100%; height: 100%; display: block;
}

.sidebar { width: 320px; display: flex; flex-direction: column; gap: 12px; }
.panel { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a4a; padding: 16px; }
.panel h3 { font-size: 13px; color: #8888aa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

.info-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1f1f35; font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-label { color: #8888aa; }
.info-value { font-weight: 500; }

.btn {
  background: linear-gradient(135deg,#2b2b5a,#1a1a3e); border: 1px solid #3a3a6a;
  color: #e0e0e0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: all .2s; width: 100%; margin-bottom: 8px;
}
.btn:hover { background: linear-gradient(135deg,#3b3b7a,#2a2a5e); border-color: #5a5a9a; }
.btn:last-child { margin-bottom: 0; }
.btn.primary { background: linear-gradient(135deg,#3b2b6a,#2a1a5e); border-color: #7b2ff7; }

.scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scene-btn {
  padding: 7px; border: 1px solid #2a2a4a; border-radius: 6px; background: #12122a;
  color: #aaaacc; cursor: pointer; font-size: 12px; transition: all .2s; text-align: center;
}
.scene-btn:hover { border-color: #5a5a9a; }
.scene-btn.on { border-color: #7b2ff7; background: #2a1a5e; color: #d0b0ff; }

.force-list { list-style: none; font-size: 13px; }
.force-item { display: flex; align-items: center; padding: 3px 0; }
.force-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }

#angleControl { margin-top: 10px; display: none; }
#angleControl label { font-size: 12px; color: #8888aa; }
#angleSlider { width: 100%; margin-top: 4px; }

.instructions { font-size: 13px; line-height: 1.6; color: #8888aa; }
.instructions kbd { background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #e0e0e0; }

#massInput { width:80px; background:#12122a; border:1px solid #2a2a4a; color:#e0e0e0; border-radius:4px; padding:2px 6px; text-align:right; font-size:13px; }

@media (max-width:900px) { .main { flex-direction: column; } .sidebar { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>⚡ AI 实时受力分析</h1>
  <span class="dot" id="statusDot"></span>
  <span id="statusText" style="font-size:13px;color:#8888aa;">初始化中...</span>
</header>

<div class="main">
  <div class="video-section">
    <div class="video-wrapper" id="videoWrapper">
      <!-- 视频元素放在 canvas 下面，opacity:0 但仍在视口中，浏览器会持续解码 -->
      <video id="capVideo" autoplay playsinline muted
             style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0;z-index:0;pointer-events:none;">
      </video>
      <canvas id="displayCanvas"></canvas>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h3>📦 选中物体</h3>
      <div class="info-row"><span class="info-label">状态</span><span class="info-value" id="objStatus">等待摄像头</span></div>
      <div class="info-row"><span class="info-label">类别</span><span class="info-value" id="objClass">—</span></div>
      <div class="info-row"><span class="info-label">跟踪ID</span><span class="info-value" id="objId">—</span></div>
      <div class="info-row"><span class="info-label">速率</span><span class="info-value" id="objSpeed">—</span></div>
      <div class="info-row">
        <span class="info-label">质量 (kg)</span>
        <input type="number" id="massInput" value="" placeholder="未知" min="0" step="0.1">
      </div>
    </div>

    <div class="panel">
      <h3>🎯 场景选择</h3>
      <p style="font-size:12px;color:#666;margin-bottom:8px;">点击画面后选择场景</p>
      <div class="scene-grid">
        <button class="scene-btn" data-scene="flat">水平面</button>
        <button class="scene-btn on" data-scene="unknown">自动</button>
        <button class="scene-btn" data-scene="incline">斜面</button>
        <button class="scene-btn" data-scene="free_fall">自由落体</button>
        <button class="scene-btn" data-scene="pendulum">悬挂</button>
      </div>
      <div id="angleControl">
        <label>斜面角度: <span id="angleDisplay">30</span>°</label>
        <input type="range" id="angleSlider" min="0" max="80" value="30">
      </div>
    </div>

    <div class="panel">
      <h3>📐 受力分析</h3>
      <ul class="force-list" id="forceList">
        <li style="color:#8888aa;font-size:13px;">点击画面开始分析</li>
      </ul>
      <div id="analysisNote" style="font-size:12px;color:#666;margin-top:8px;display:none;"></div>
    </div>

    <div class="panel">
      <button class="btn primary" id="btnToggle">▶ 启动摄像头</button>
      <p class="instructions">
        拖拽画框选定目标 → 纯跟踪模式（省算力）<br>
        目标被遮挡时自动按运动规律预判位置<br>
        点击画面任意位置可快速分析<br>
        <kbd>R</kbd> 重置
      </p>
    </div>
  </div>
</div>

<!-- 隐藏的 video 元素，只用于接收摄像头流 -->


<script>
// ===== 状态 =====
let videoStream = null;
let isRunning = false;
let animFrameId = null;
let detectInterval = null;
let selectedTrackId = null;
let currentScene = 'unknown';
let currentAngle = 30;
let lastDetectResult = null;
let pendingClick = null; // {x, y} 待处理的点击

// 重心实时外推状态：两次检测之间用速度插值，让重心标记实时跟随物体
// （检测间隔 100ms 内物体仍会移动，纯显示旧位置会显得"重心跟不上"）
let lastCenter = null;        // 最近一次检测的重心（640 空间）
let lastCenterTime = 0;       // performance.now() 时刻
let lastVel = { vx: 0, vy: 0 }; // 最近一次检测的速度（像素/帧）

// 外推重心（640 空间）：lastCenter + 速度 × 已过帧数
function extrapolatedCenter() {
  if (!lastCenter) return null;
  const dtFrames = detectIntervalMs > 0
    ? (performance.now() - lastCenterTime) / detectIntervalMs : 0;
  return {
    cx: lastCenter[0] + lastVel.vx * dtFrames,
    cy: lastCenter[1] + lastVel.vy * dtFrames,
  };
}

// 框选跟踪交互状态（大疆追车式：拖拽画框选目标）
let isDragging = false;
let dragStart = null;  // 640 空间
let dragRect = null;   // {x1,y1,x2,y2} 640 空间
let detectIntervalMs = 500;

// 检测帧统一降采样到 640 宽（后端检测空间），JPEG 从 MB 级降到 ~60KB
const CAP_W = 640;
const captureCanvas = document.createElement('canvas');

const canvas = document.getElementById('displayCanvas');
const ctx = canvas.getContext('2d');
const capVideo = document.getElementById('capVideo');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const massInput = document.getElementById('massInput');
function getMass() { return parseFloat(massInput.value) || 0; }

// 颜色
const FORCE_COLORS = {
  gravity: [0,0,255], normal: [0,255,0], friction: [255,128,0],
  tension: [255,255,0], applied: [255,0,255], air: [200,200,200], net: [0,255,255],
};

// 中文名
const CN_CLASS = {
  person:'人', bicycle:'自行车', car:'汽车', motorcycle:'摩托车', airplane:'飞机',
  bus:'公交车', train:'火车', truck:'卡车', boat:'船',
  bottle:'瓶子', cup:'杯子', fork:'叉子', knife:'刀', spoon:'勺子', bowl:'碗',
  cell_phone:'手机', remote:'遥控器', book:'书', scissors:'剪刀',
  sports_ball:'球', frisbee:'飞盘', kite:'风筝',
  banana:'香蕉', apple:'苹果', orange:'橙子', sandwich:'三明治',
  chair:'椅子', couch:'沙发', dining_table:'餐桌', bed:'床',
  tv:'电视', laptop:'笔记本电脑', mouse:'鼠标', keyboard:'键盘',
};

// ===== 摄像头 =====
async function startCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, facingMode: 'environment' },
      audio: false,
    });
    capVideo.srcObject = videoStream;
    await capVideo.play();
    const w = capVideo.videoWidth || 640, h = capVideo.videoHeight || 480;
    canvas.width = w; canvas.height = h;
    statusDot.className = 'dot on';
    statusText.textContent = `摄像头 ${w}x${h}`;
    // 初始化后端
    await fetch('/api/detect/start', { method: 'POST' });
    return true;
  } catch(e) {
    statusDot.className = 'dot';
    statusText.textContent = '摄像头不可用';
    console.error('Camera error:', e);
    return false;
  }
}

function stopCamera() {
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  capVideo.srcObject = null;
  isRunning = false;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  if (detectInterval) { clearInterval(detectInterval); detectInterval = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  statusDot.className = 'dot';
  statusText.textContent = '已停止';
}

// ===== 渲染循环 =====
function renderLoop() {
  if (!isRunning || !capVideo.videoWidth) {
    animFrameId = requestAnimationFrame(renderLoop);
    return;
  }

  const w = canvas.width, h = canvas.height;
  // 画摄像头帧
  ctx.drawImage(capVideo, 0, 0, w, h);

  // 拖拽画框中 → 显示选择框
  if (isDragging && dragRect) {
    drawDragRect();
  }

  // 如果有检测结果，画覆盖层
  if (lastDetectResult) {
    drawOverlays(lastDetectResult);
  }

  animFrameId = requestAnimationFrame(renderLoop);
}

// 拖拽中的选择框（半透明红色虚线框）
function drawDragRect() {
  const scale = canvas.width / CAP_W;
  const {x1,y1,x2,y2} = dragRect;
  const sx = x1*scale, sy = y1*scale, sw = (x2-x1)*scale, sh = (y2-y1)*scale;
  ctx.fillStyle = 'rgba(255,80,80,0.15)';
  ctx.fillRect(sx, sy, sw, sh);
  ctx.strokeStyle = 'rgba(255,80,80,0.95)';
  ctx.lineWidth = 2 * scale;
  ctx.setLineDash([6*scale, 4*scale]);
  ctx.strokeRect(sx, sy, sw, sh);
  ctx.setLineDash([]);
  ctx.font = `${Math.round(13*scale)}px monospace`;
  ctx.fillStyle = '#ff6666';
  ctx.fillText('松开完成框选', sx + 8*scale, sy - 8*scale);
}

// ===== 画覆盖层（后端返回的 bbox/力都在 640 检测空间，×scale 映射到 canvas）=====
function drawOverlays(data) {
  const w = canvas.width, h = canvas.height;
  const scale = w / CAP_W;

  // 检测框（ROI 模式按跟踪状态着色：跟踪=绿实线 / 遮挡预测=橙虚线 / 丢失=红虚线）
  for (const det of data.detections || []) {
    const [x1,y1,x2,y2] = det.bbox;
    const isSel = det.selected;
    let strokeStyle = '#ffffff', labelColor = '#ffffff', dash = [];
    if (data.mode === 'roi') {
      if (data.tracking_state === 'predicting') { strokeStyle = '#ffaa00'; labelColor = '#ffaa00'; dash = [6*scale,4*scale]; }
      else if (data.tracking_state === 'lost')   { strokeStyle = '#ff4444'; labelColor = '#ff4444'; dash = [3*scale,5*scale]; }
      else                                       { strokeStyle = '#00ff88'; labelColor = '#00ff88'; }
    } else {
      strokeStyle = isSel ? '#00ff88' : '#ffffff';
      labelColor = isSel ? '#00ff88' : '#ffffff';
    }
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = (isSel ? 3 : 1.5) * scale;
    ctx.setLineDash(dash);
    ctx.strokeRect(x1*scale, y1*scale, (x2-x1)*scale, (y2-y1)*scale);
    ctx.setLineDash([]);

    const cnName = CN_CLASS[det.class_name] || det.class_name;
    let label = `#${det.track_id} ${cnName} ${(det.confidence*100).toFixed(0)}%`;
    if (data.mode === 'roi' && data.tracking_state === 'predicting') label = `☁ ${cnName} 遮挡预测中`;
    if (data.mode === 'roi' && data.tracking_state === 'lost') label = `✖ ${cnName} 已丢失`;
    ctx.font = `${Math.round(14 * scale)}px monospace`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x1*scale, y1*scale-Math.round(20*scale), tw+8*scale, Math.round(20*scale));
    ctx.fillStyle = labelColor;
    ctx.fillText(label, x1*scale+4*scale, y1*scale-5*scale);

    if (isSel) {
      // 重心标记：用外推中心（两次检测之间随速度实时跟随物体）
      const ext = extrapolatedCenter();
      const cx = (ext ? ext.cx : (x1+x2)/2) * scale;
      const cy = (ext ? ext.cy : (y1+y2)/2) * scale;
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 1 * scale;
      ctx.beginPath();
      ctx.moveTo(cx-8*scale, cy); ctx.lineTo(cx+8*scale, cy);
      ctx.moveTo(cx, cy-8*scale); ctx.lineTo(cx, cy+8*scale);
      ctx.stroke();
    }
  }

  // 受力分析（力箭头起点 = 外推重心，实时跟随物体）
  if (data.analysis && data.selected_id != null) {
    const det = (data.detections || []).find(d => d.track_id === data.selected_id);
    if (det) {
      const ext = extrapolatedCenter();
      const cx = (ext ? ext.cx : (det.bbox[0]+det.bbox[2])/2) * scale;
      const cy = (ext ? ext.cy : (det.bbox[1]+det.bbox[3])/2) * scale;

      for (const f of data.analysis.forces) {
        drawArrow(ctx, cx, cy, f, scale);
      }
      if (data.analysis.net_force && data.analysis.net_force.magnitude > 0.5) {
        drawArrow(ctx, cx, cy, { ...data.analysis.net_force, type:'net', color: [0,255,255] }, scale);
      }

      if (data.velocity) {
        const {vx,vy} = data.velocity;
        if (Math.sqrt(vx*vx+vy*vy) > 2) {
          ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + vx*5*scale, cy + vy*5*scale);
          ctx.stroke();
        }
      }
    }
  }

  // 更新侧栏
  updateSidebar(data);
}

function drawArrow(ctx, x, y, f, scale) {
  // 力线长度压缩到统一区间 [30,70]px（640 空间）：
  // - 弱力（摩擦力/阻力）不会太短（下限 30，比 G 略长也符合直觉）
  // - 强力（外力/加速拉力）不会爆炸（上限 70）
  // - 等值力（静止悬挂 T=G、水平面 N=G）自然等长
  // - 差值力（向上加速 T>G）在区间内体现长度差异
  const MIN_LEN = 30, MAX_LEN = 70;
  const len = Math.min(MAX_LEN, Math.max(MIN_LEN, f.magnitude * 2.5)) * scale;
  if (len < 3) return;
  const rad = f.angle * Math.PI / 180;
  const ex = x + len * Math.cos(rad);
  const ey = y + len * Math.sin(rad);
  const [r,g,b] = f.color || FORCE_COLORS[f.type] || [255,255,255];

  ctx.strokeStyle = `rgb(${r},${g},${b})`;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.lineWidth = 2.5 * scale;  // 统一线宽，不再随力大小变粗

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.stroke();

  const angle = Math.atan2(ey-y, ex-x);
  const headLen = 10 * scale;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - headLen*Math.cos(angle-0.4), ey - headLen*Math.sin(angle-0.4));
  ctx.lineTo(ex - headLen*Math.cos(angle+0.4), ey - headLen*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fill();

  if (f.label) {
    ctx.font = `${Math.round(12 * scale)}px monospace`;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillText(f.label, ex + 8*scale, ey - 5*scale);
  }
}

// ===== 检测请求 =====
// roiStr: "x1,y1,x2,y2"（640 空间）→ 框选跟踪模式；null → 点击/YOLO 模式
async function sendDetect(clickX, clickY, roiStr) {
  if (!isRunning || !capVideo.videoWidth) return;

  // 降采样到 CAP_W 宽（后端检测空间）：
  // 1) JPEG 体积从全分辨率下的 MB 级降到 ~60KB，传输延迟大减
  // 2) 后端推理输入小，速度快数倍
  const capH = Math.round(canvas.height * CAP_W / canvas.width);
  captureCanvas.width = CAP_W;
  captureCanvas.height = capH;
  captureCanvas.getContext('2d').drawImage(capVideo, 0, 0, CAP_W, capH);
  const blob = await new Promise(r => captureCanvas.toBlob(r, 'image/jpeg', 0.75));

  const fd = new FormData();
  fd.append('image', blob, 'frame.jpg');
  fd.append('scene', currentScene);
  fd.append('angle', currentAngle);
  fd.append('mass', getMass());
  fd.append('auto_select', '1'); // 后端自动选中最小非人物体（未选中时）
  if (roiStr) fd.append('roi', roiStr);
  if (clickX != null) fd.append('click_x', clickX);
  if (clickY != null) fd.append('click_y', clickY);

  try {
    const res = await fetch('/api/detect', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.success) return;
    lastDetectResult = data;
    // 保存重心外推状态：用最新检测的重心 + 速度，供两次检测之间实时插值
    if (data.mode === 'roi' && data.detections && data.detections.length) {
      const d0 = data.detections[0];
      lastCenter = [(d0.bbox[0]+d0.bbox[2])/2, (d0.bbox[1]+d0.bbox[3])/2];
      lastCenterTime = performance.now();
      lastVel = data.velocity
        ? { vx: data.velocity.vx || 0, vy: data.velocity.vy || 0 }
        : { vx: 0, vy: 0 };
    } else {
      lastCenter = null;  // YOLO 模式不插值（检测稀疏，速度不可靠）
    }
    // 发送间隔自适应：ROI 纯跟踪便宜 → 100ms 高频（重心实时跟随）；
    // 自由落体 → 100ms 高频采样（慢动作）；YOLO 识别 → 降频省带宽
    let want = 500;
    if (data.mode === 'roi') {
      want = (data.analysis && data.analysis.scene === 'free_fall') ? 100 : 100;
    }
    if (want !== detectIntervalMs) {
      detectIntervalMs = want;
      clearInterval(detectInterval);
      detectInterval = setInterval(autoDetect, detectIntervalMs);
    }
  } catch(e) { console.error('Detect error:', e); }
}

// ===== 定时检测 =====
// 空闲时不发帧（省算力，等用户框选/点击）；ROI 跟踪或已选中的 YOLO 才持续发帧
async function autoDetect() {
  if (!isRunning) return;
  const lr = lastDetectResult;
  if (!lr) return;
  if (lr.mode === 'roi' || (lr.mode === 'yolo' && lr.selected_id != null)) {
    await sendDetect(null, null);
  }
}

// ===== 鼠标交互（大疆式框选：拖拽画框选目标，点击保留快速分析）=====
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const capH = Math.round(canvas.height * CAP_W / canvas.width);
  return {
    x: Math.round((e.clientX - rect.left) / rect.width * CAP_W),
    y: Math.round((e.clientY - rect.top) / rect.height * capH),
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (!isRunning) return;
  const p = canvasPos(e);
  isDragging = true;
  dragStart = p;
  dragRect = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging || !dragStart) return;
  const p = canvasPos(e);
  dragRect = {
    x1: Math.min(dragStart.x, p.x),
    y1: Math.min(dragStart.y, p.y),
    x2: Math.max(dragStart.x, p.x),
    y2: Math.max(dragStart.y, p.y),
  };
});

canvas.addEventListener('mouseup', async (e) => {
  if (!isDragging || !dragStart) return;
  isDragging = false;
  const p = canvasPos(e);
  const dx = Math.abs(p.x - dragStart.x), dy = Math.abs(p.y - dragStart.y);
  const rect = dragRect;
  dragRect = null; dragStart = null;

  if (dx < 8 && dy < 8) {
    // 位移极小 → 视为点击（保留快速分析兜底）
    await sendDetect(p.x, p.y);
  } else {
    // 拖拽框选 → 纯跟踪模式（不跑 YOLO）
    if ((rect.x2-rect.x1) >= 8 && (rect.y2-rect.y1) >= 8) {
      await sendDetect(null, null, `${rect.x1},${rect.y1},${rect.x2},${rect.y2}`);
    }
  }
});

// ===== 侧栏更新 =====
function updateSidebar(data) {
  // header 显示当前模式
  if (data.mode === 'roi') {
    statusText.textContent = '框选跟踪（不跑 YOLO）';
  } else if (data.mode === 'yolo') {
    statusText.textContent = '目标识别';
  }
  const sel = (data.detections || []).find(d => d.selected);
  const oS = document.getElementById('objStatus');
  const oC = document.getElementById('objClass');
  const oI = document.getElementById('objId');
  const oSp = document.getElementById('objSpeed');
  const fL = document.getElementById('forceList');
  const aN = document.getElementById('analysisNote');

  if (sel) {
    // ROI 模式：显示跟踪状态
    if (lastDetectResult && lastDetectResult.mode === 'roi') {
      const st = lastDetectResult.tracking_state;
      if (st === 'predicting') { oS.textContent = '遮挡预测中'; oS.style.color = '#ffaa00'; }
      else if (st === 'lost')  { oS.textContent = '已丢失'; oS.style.color = '#ff4444'; }
      else                     { oS.textContent = '跟踪中'; oS.style.color = '#44ff88'; }
    } else {
      oS.textContent = '已选中'; oS.style.color = '#44ff88';
    }
    oC.textContent = CN_CLASS[sel.class_name] || sel.class_name;
    oI.textContent = '#' + sel.track_id;
    // 速度换算为像素/秒（后端单位 px/帧，间隔自适应）
    oSp.textContent = ((data.velocity?.speed || 0) * (1000/detectIntervalMs)).toFixed(1) + ' 像素/秒';
    selectedTrackId = sel.track_id;
  } else {
    oS.textContent = data.selected_id ? '已选中' : '未选中';
    oS.style.color = data.selected_id ? '#44ff88' : '#ff4444';
    oC.textContent = data.selected_id ? '?' : '—';
    oI.textContent = data.selected_id ? '#' + data.selected_id : '—';
    oSp.textContent = '—';
    selectedTrackId = data.selected_id;
  }

  fL.innerHTML = '';
  if (data.analysis && data.analysis.forces) {
    for (const f of data.analysis.forces) {
      const [r,g,b] = f.color || FORCE_COLORS[f.type] || [255,255,255];
      const li = document.createElement('li');
      li.className = 'force-item';
      li.innerHTML = `<span class="force-dot" style="background:rgb(${r},${g},${b})"></span>${f.label}`;
      fL.appendChild(li);
    }
    if (data.analysis.net_force && data.analysis.net_force.magnitude > 0.5) {
      const nf = data.analysis.net_force;
      const li = document.createElement('li');
      li.className = 'force-item';
      li.innerHTML = `<span class="force-dot" style="background:rgb(0,255,255)"></span>${nf.label}=${nf.magnitude.toFixed(1)}N`;
      fL.appendChild(li);
    }
    if (data.analysis.note) {
      aN.textContent = data.analysis.note; aN.style.display = 'block';
    } else { aN.style.display = 'none'; }
  } else {
    fL.innerHTML = '<li style="color:#8888aa;font-size:13px;">点击画面开始分析</li>';
    aN.style.display = 'none';
  }
}

// ===== 场景选择 =====
document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentScene = btn.dataset.scene;
    document.getElementById('angleControl').style.display = currentScene === 'incline' ? 'block' : 'none';
  });
});
document.getElementById('angleSlider').addEventListener('input', (e) => {
  currentAngle = parseInt(e.target.value);
  document.getElementById('angleDisplay').textContent = currentAngle;
});

// ===== 启动/停止 =====
document.getElementById('btnToggle').addEventListener('click', async () => {
  if (isRunning) {
    stopCamera();
    document.getElementById('btnToggle').textContent = '▶ 启动摄像头';
    statusText.textContent = '已停止';
    statusDot.className = 'dot';
  } else {
    document.getElementById('btnToggle').textContent = '⏳ 启动中...';
    const ok = await startCamera();
    if (ok) {
      isRunning = true;
      document.getElementById('btnToggle').textContent = '⏹ 停止摄像头';
      // 启动渲染循环
      renderLoop();
      // 启动定时检测（每 500ms 一次）
      detectInterval = setInterval(autoDetect, 500);
    } else {
      document.getElementById('btnToggle').textContent = '▶ 启动摄像头';
    }
  }
});

// ===== 快捷键 =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    selectedTrackId = null; lastDetectResult = null;
    isDragging = false; dragStart = null; dragRect = null;
    // 同步重置后端选中状态，否则下一帧又会返回旧的选中
    fetch('/api/reset', { method: 'POST' }).catch(() => {});
    statusText.textContent = '已重置';
    document.getElementById('objStatus').textContent = '未选中';
    document.getElementById('objStatus').style.color = '#ff4444';
    document.getElementById('objClass').textContent = '—';
    document.getElementById('objId').textContent = '—';
    document.getElementById('objSpeed').textContent = '—';
    document.getElementById('forceList').innerHTML = '<li style="color:#8888aa;font-size:13px;">点击画面开始分析</li>';
  }
});

statusText.textContent = '点击"启动摄像头"开始';
console.log('AI 实时受力分析系统 v3.0 (纯 Canvas 模式)');
</script>
