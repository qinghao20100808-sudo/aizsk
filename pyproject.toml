[project]
name = "aizsk"
version = "0.1.0"
description = "AI 实时受力分析系统 - 基于计算机视觉的高中物理教学辅助工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.scripts]
aizsk = "aizsk.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
